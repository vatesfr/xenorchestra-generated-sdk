name: Release Java SDK

on:
  push:
    tags:
      - "java-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#java-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || "$version" == *SNAPSHOT* ]]; then
            echo "Invalid Java release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "JAVA_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        run: test "$(mvn --batch-mode --quiet --file sdk/java/pom.xml help:evaluate -Dexpression=project.version -DforceStdout)" = "$JAVA_SDK_VERSION"
      - name: Test generated SDK
        run: make lint-generated-sdks test-generated-sdks test-examples
        env:
          SDK_TARGETS: java
      # Lay out the artifacts as a Maven repository; signing happens in the
      # publish job so that no build step can read the signing key.
      - name: Stage Maven Central bundle
        shell: bash
        run: |
          mvn --batch-mode --file sdk/java/pom.xml -DskipTests -DaltDeploymentRepository="staging::file://$PWD/staging" deploy
          find staging -name 'maven-metadata.xml*' -delete
          find staging -name '*-tests.jar*' -delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-sdk
          path: staging/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-sdk
          path: staging
      - name: Sign artifacts
        shell: bash
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
          find staging -type f ! -name '*.md5' ! -name '*.sha1' -print0 |
            while IFS= read -r -d '' file; do
              printf '%s' "$MAVEN_GPG_PASSPHRASE" |
                gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign "$file"
            done
          rm -rf "$GNUPGHOME"
      - name: Publish to Maven Central
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          (cd staging && zip -qr ../bundle.zip .)
          authorization="Authorization: Bearer $(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          deployment="$(curl --fail-with-body --silent --show-error --request POST --header "$authorization" \
            --form bundle=@bundle.zip \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=$GITHUB_REF_NAME")"
          echo "Deployment $deployment"
          for _ in $(seq 120); do
            status="$(curl --fail-with-body --silent --show-error --request POST --header "$authorization" \
              "https://central.sonatype.com/api/v1/publisher/status?id=$deployment")"
            state="$(jq -r .deploymentState <<<"$status")"
            echo "State: $state"
            case "$state" in
              PUBLISHED) exit 0 ;;
              FAILED) jq . <<<"$status" >&2; exit 1 ;;
            esac
            sleep 30
          done
          echo "Deployment $deployment was not published after 60 minutes" >&2
          exit 1
