name: Release Rust SDK

on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Rust release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RUST_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        shell: bash
        run: |
          actual="$(cargo metadata --no-deps --format-version 1 --manifest-path sdk/rust/Cargo.toml | jq -r '.packages[0].version')"
          test "$actual" = "$RUST_SDK_VERSION"
      - name: Test generated SDKs
        run: make lint-generated-sdks test-generated-sdks test-examples
      - name: Verify crate package
        run: cargo package --manifest-path sdk/rust/Cargo.toml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-sdk
          path: |
            sdk/rust/
            !sdk/rust/target/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-sdk
          path: sdk/rust
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish to crates.io
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
