name: Release Rust SDK

on:
  push:
    tags:
      - "rust-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#rust-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Rust release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "RUST_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        shell: bash
        run: |
          actual="$(cargo metadata --no-deps --format-version 1 --manifest-path sdk/rust/Cargo.toml | jq -r '.packages[0].version')"
          test "$actual" = "$RUST_SDK_VERSION"
      - name: Test generated SDKs
        run: make lint-generated-sdks test-generated-sdks test-examples
      - name: Verify crate package
        run: cargo package --manifest-path sdk/rust/Cargo.toml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-sdk
          path: |
            sdk/rust/
            !sdk/rust/target/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-sdk
          path: sdk/rust
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish to crates.io
        run: cargo publish --manifest-path sdk/rust/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
