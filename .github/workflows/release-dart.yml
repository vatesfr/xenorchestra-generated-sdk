name: Release Dart SDK

on:
  push:
    tags: ["dart-v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#dart-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Dart release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "DART_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        working-directory: sdk/dart-dio
        run: |
          dart pub get
          test "$(dart pub deps --json | jq -r '.packages[] | select(.kind == "root") | .version')" = "$DART_SDK_VERSION"
      - name: Test generated SDK
        run: make lint-generated-sdks test-generated-sdks test-examples
        env:
          SDK_TARGETS: dart-dio
      - name: Verify publishable package
        working-directory: sdk/dart-dio
        run: dart pub publish --dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dart-sdk
          # Keep .gitignore: pub applies it when selecting published files.
          include-hidden-files: true
          path: |
            sdk/dart-dio/
            !sdk/dart-dio/.dart_tool/
            !sdk/dart-dio/build/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pub-dev
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dart-sdk
          path: sdk/dart-dio
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
      - name: Publish to pub.dev
        working-directory: sdk/dart-dio
        run: dart pub publish --force
