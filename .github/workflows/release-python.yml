name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.](post|dev)[0-9]+)?$ ]]; then
            echo "Invalid Python release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "PYTHON_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        working-directory: sdk/python
        run: python -c 'import tomllib, os; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["PYTHON_SDK_VERSION"]'
      - name: Test generated SDKs
        run: make lint-generated-sdks test-generated-sdks test-examples
      - name: Build Python distributions
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          test "$(find dist -maxdepth 1 -name 'xenorchestra_python_sdk-*.whl' | wc -l)" -eq 1
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import xenorchestra_client'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
