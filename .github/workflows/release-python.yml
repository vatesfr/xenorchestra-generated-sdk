name: Release Python SDK

on:
  push:
    tags:
      - "python-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Read and validate version from tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.](post|dev)[0-9]+)?$ ]]; then
            echo "Invalid Python release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "PYTHON_SDK_VERSION=$version" >> "$GITHUB_ENV"
      - name: Generate SDKs
        run: make generate
      - name: Test generator and reproducibility
        run: make test-sdk check-idempotence
      - name: Verify generated version
        working-directory: sdk/python
        run: python -c 'import tomllib, os; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == os.environ["PYTHON_SDK_VERSION"]'
      - name: Test generated SDKs
        run: make lint-generated-sdks test-generated-sdks test-examples
      - name: Build Python distributions
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          test "$(find dist -maxdepth 1 -name 'xenorchestra_python_sdk-*.whl' | wc -l)" -eq 1
          python -m twine check dist/*
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -c 'import xenorchestra_client'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-distributions
          path: sdk/python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
