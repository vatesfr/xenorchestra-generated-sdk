services:
  xo-api-sim:
    image: ghcr.io/vatesfr/xo-api-sim:0.4.0
    environment:
      FIXTURES_DIR: /fixtures
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./fixtures:/fixtures:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/ping"]
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"
