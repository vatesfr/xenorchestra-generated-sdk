[package]
name = "xenorchestra-rust-sdk"
version = "0.1.0"
authors = ["Vates SAS"]
description = "REST API to manage your XOA"
license = "AGPL-3.0-or-later"
edition = "2021"
repository = "https://github.com/vatesfr/xenorchestra-generated-sdk"
homepage = "https://xen-orchestra.com"
documentation = "https://docs.rs/xenorchestra-rust-sdk"

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_with = { version = "^3.8", default-features = false, features = ["base64", "std", "macros"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
tokio = { version = "^1.46.0", features = ["fs"] }
tokio-util = { version = "^0.7", features = ["codec"] }
reqwest = { version = "^0.13", default-features = false, features = ["json", "multipart", "stream", "query", "form"] }

[features]
default = ["rustls"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
